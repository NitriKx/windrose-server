apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "windrose.fullname" . }}
  labels:
    {{- include "windrose.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "windrose.selectorLabels" . | nindent 6 }}
  serviceName: {{ include "windrose.fullname" . }}
  template:
    metadata:
      labels:
        {{- include "windrose.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: copy-config
          image: busybox
          command:
            - sh
            - -c
            - |
              mkdir -p /srv/windrose/config
              cp /etc/windrose-config/ServerDescription.json /srv/windrose/config/ServerDescription.json
          volumeMounts:
            - name: config-template
              mountPath: /etc/windrose-config
              readOnly: true
            - name: config
              mountPath: /srv/windrose/config
      containers:
        - name: windrose
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: STEAM_UPDATE_ON_BOOT
              value: {{ .Values.steam.updateOnBoot | quote }}
            - name: STEAM_USERNAME
              value: {{ .Values.steam.username | quote }}
            - name: STEAM_PASSWORD
              value: {{ .Values.steam.password | quote }}
            - name: STEAMCMD_APP_ID
              value: {{ .Values.steam.appId | quote }}
            - name: STEAMCMD_PLATFORM
              value: {{ .Values.steam.platform | quote }}
            - name: STEAMCMD_VALIDATE
              value: {{ .Values.steam.validate | quote }}
            # Redirect all data directories into the data PVC
            - name: SOURCE_DIR
              value: /srv/windrose/data/source
            - name: RUNTIME_DIR
              value: /srv/windrose/data/runtime
            - name: STEAM_STATE_DIR
              value: /srv/windrose/data/steamcmd
            - name: LOG_DIR
              value: /srv/windrose/data/logs
            # Persist Wine prefix in the data PVC to avoid re-init on every restart
            - name: WINEPREFIX
              value: /srv/windrose/data/wine
            # Config dir is populated by the init container from the ConfigMap
            - name: CONFIG_DIR
              value: /srv/windrose/config
          ports:
            - name: game-udp
              containerPort: {{ .Values.server.directConnectionPort }}
              protocol: UDP
            - name: game-tcp
              containerPort: {{ .Values.server.directConnectionPort }}
              protocol: TCP
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /srv/windrose/data
            - name: config
              mountPath: /srv/windrose/config
      volumes:
        - name: config-template
          configMap:
            name: {{ include "windrose.fullname" . }}-config
        - name: config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}

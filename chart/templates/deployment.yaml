apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "windrose.fullname" . }}
  labels:
    {{- include "windrose.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "windrose.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "windrose.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      initContainers:
        - name: copy-config
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /srv/windrose/config
              cp /etc/windrose-config/ServerDescription.json /srv/windrose/config/ServerDescription.json
          volumeMounts:
            - name: config-template
              mountPath: /etc/windrose-config
              readOnly: true
            - name: config
              mountPath: /srv/windrose/config
      containers:
        - name: windrose
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: STEAM_UPDATE_ON_BOOT
              value: {{ .Values.steam.updateOnBoot | quote }}
            - name: STEAM_USERNAME
              {{- if .Values.steam.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.steam.existingSecret }}
                  key: username
              {{- else }}
              value: {{ .Values.steam.username | quote }}
              {{- end }}
            - name: STEAM_PASSWORD
              {{- if .Values.steam.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.steam.existingSecret }}
                  key: password
              {{- else }}
              value: {{ .Values.steam.password | quote }}
              {{- end }}
            - name: STEAMCMD_APP_ID
              value: {{ .Values.steam.appId | quote }}
            - name: STEAMCMD_PLATFORM
              value: {{ .Values.steam.platform | quote }}
            - name: STEAMCMD_VALIDATE
              value: {{ .Values.steam.validate | quote }}
            - name: SOURCE_DIR
              value: /srv/windrose/source
            - name: RUNTIME_DIR
              value: /srv/windrose/runtime
            - name: STEAM_STATE_DIR
              value: /srv/windrose/runtime/steamcmd
            - name: LOG_DIR
              value: /srv/windrose/runtime/logs
            - name: WINEPREFIX
              value: /srv/windrose/runtime/wine
            - name: CONFIG_DIR
              value: /srv/windrose/config
            # Server identity
            - name: WINDROSE_SERVER_NOTE
              value: {{ .Values.server.note | quote }}
            - name: WINDROSE_P2P_PROXY_ADDRESS
              value: {{ .Values.server.p2pProxyAddress | quote }}
            - name: WINDROSE_REGION
              value: {{ .Values.server.region | quote }}
            - name: WINDROSE_DIRECT_CONNECTION_ADDRESS
              value: {{ .Values.server.directConnectionAddress | quote }}
            - name: WINDROSE_DIRECT_CONNECTION_PORT
              value: {{ .Values.server.directConnectionPort | quote }}
            - name: WINDROSE_SERVER_ARGS
              value: {{ .Values.server.extraArgs | quote }}
            # World settings
            - name: WINDROSE_WORLD_NAME
              value: {{ .Values.world.name | quote }}
            - name: WINDROSE_WORLD_PRESET
              value: {{ .Values.world.preset | quote }}
            - name: WINDROSE_MOB_HEALTH_MULTIPLIER
              value: {{ .Values.world.mobHealthMultiplier | quote }}
            - name: WINDROSE_MOB_DAMAGE_MULTIPLIER
              value: {{ .Values.world.mobDamageMultiplier | quote }}
            - name: WINDROSE_SHIP_HEALTH_MULTIPLIER
              value: {{ .Values.world.shipHealthMultiplier | quote }}
            - name: WINDROSE_SHIP_DAMAGE_MULTIPLIER
              value: {{ .Values.world.shipDamageMultiplier | quote }}
            - name: WINDROSE_BOARDING_DIFFICULTY_MULTIPLIER
              value: {{ .Values.world.boardingDifficultyMultiplier | quote }}
            - name: WINDROSE_COOP_STATS_CORRECTION_MODIFIER
              value: {{ .Values.world.coopStatsCorrectionModifier | quote }}
            - name: WINDROSE_COOP_SHIP_STATS_CORRECTION_MODIFIER
              value: {{ .Values.world.coopShipStatsCorrectionModifier | quote }}
            - name: WINDROSE_EASY_EXPLORE
              value: {{ .Values.world.easyExplore | quote }}
            - name: WINDROSE_COOP_SHARED_QUESTS
              value: {{ .Values.world.coopSharedQuests | quote }}
            - name: WINDROSE_COMBAT_DIFFICULTY
              value: {{ .Values.world.combatDifficulty | quote }}
          {{- with .Values.extraEnv }}
          {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: game-udp
              containerPort: {{ .Values.server.directConnectionPort }}
              protocol: UDP
            - name: game-tcp
              containerPort: {{ .Values.server.directConnectionPort }}
              protocol: TCP
            - name: query-udp
              containerPort: {{ .Values.server.queryPort }}
              protocol: UDP
          startupProbe:
            exec:
              command:
                - test
                - -f
                - /srv/windrose/runtime/R5/ServerDescription.json
            initialDelaySeconds: 60
            failureThreshold: 40
            periodSeconds: 15
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - WindroseServer
            initialDelaySeconds: 0
            periodSeconds: 30
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: source
              mountPath: /srv/windrose/source
            - name: runtime
              mountPath: /srv/windrose/runtime
            - name: config
              mountPath: /srv/windrose/config
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: {{ include "windrose.fullname" . }}-source
        - name: runtime
          persistentVolumeClaim:
            claimName: {{ include "windrose.fullname" . }}-runtime
        - name: config-template
          configMap:
            name: {{ include "windrose.fullname" . }}-config
        - name: config
          emptyDir: {}

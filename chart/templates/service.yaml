apiVersion: v1
kind: Service
metadata:
  name: {{ include "windrose.fullname" . }}
  labels:
    {{- include "windrose.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  ports:
    - name: game-udp
      port: {{ .Values.server.directConnectionPort }}
      targetPort: {{ .Values.server.directConnectionPort }}
      protocol: UDP
    - name: game-tcp
      port: {{ .Values.server.directConnectionPort }}
      targetPort: {{ .Values.server.directConnectionPort }}
      protocol: TCP
    - name: query-udp
      port: {{ .Values.server.queryPort }}
      targetPort: {{ .Values.server.queryPort }}
      protocol: UDP
  selector:
    {{- include "windrose.selectorLabels" . | nindent 4 }}

image:
  repository: ghcr.io/nitrikx/windrose-dedicated
  tag: latest # renovate: datasource=docker depName=ghcr.io/nitrikx/windrose-dedicated
  pullPolicy: Always

steam:
  updateOnBoot: true
  username: ""
  password: ""
  appId: "4129620"
  platform: "windows"
  validate: false

server:
  name: "Windrose Server"
  # Invite code for players to join (min 6 chars, alphanumeric, case-sensitive).
  # Leave empty to auto-generate on first boot.
  inviteCode: ""
  isPasswordProtected: false
  password: ""
  maxPlayerCount: 4
  region: "EU"
  # Direct connection settings — exposed via the LoadBalancer service
  directConnectionPort: 7777

service:
  type: LoadBalancer
  loadBalancerIP: ""
  annotations: {}
  #  external-dns.alpha.kubernetes.io/hostname: "windrose.games.p0i.re"
  #  external-dns.alpha.kubernetes.io/target: "176.157.111.189"
  #  external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"

resources:
  requests:
    cpu: "2"
    memory: 8Gi
  limits:
    memory: 12Gi

persistence:
  # Game files: ~35GB source + ~35GB runtime rsync copy on first boot.
  size: 80Gi
  storageClass: "local-path"
  accessMode: ReadWriteOnce
  annotations: {}

nodeSelector:
  kubernetes.io/os: linux

tolerations: []

affinity: {}

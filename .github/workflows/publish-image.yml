name: Build and push Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build and push (e.g. 0.2.0)"
        required: true

jobs:
  build-push:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.release.tag_name, 'v') && !startsWith(github.event.release.tag_name, 'chart-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            TAG="${{ github.event.release.tag_name }}"
            echo "tag=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nitrikx/windrose-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./container
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin image version in Helm chart
        env:
          GH_TOKEN: ${{ secrets.RP_GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          sed -i "s|^  tag: [^ ]*|  tag: \"${VERSION}\"|" chart/values.yaml
          sed -i "s|^appVersion: \"[^\"]*\"|appVersion: \"${VERSION}\"|" chart/Chart.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add chart/values.yaml chart/Chart.yaml
          git commit -m "fix(chart): update windrose-server image to ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run release-please.yml --repo "${{ github.repository }}"
